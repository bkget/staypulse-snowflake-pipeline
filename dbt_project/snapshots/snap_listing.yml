# SCD Type 2 (dbt 1.9+ YAML snapshots). Replay the older snapshot first:
#   dbt snapshot --vars '{snapshot_date: 2026-06-22}'
#   dbt snapshot --vars '{snapshot_date: 2026-09-17}'
snapshots:
  - name: snap_listing
    relation: ref('int_listings_asof')
    config:
      schema: snapshots
      unique_key: listing_id
      strategy: timestamp
      updated_at: effective_at
      hard_deletes: invalidate                       # a listing missing from the newer snapshot is closed, not left open
      dbt_valid_to_current: "to_timestamp_ntz('9999-12-31')"
      transient: false                               # keep Time Travel on the history table
